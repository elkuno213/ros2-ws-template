services:
  ros2:
    container_name: ros2
    image: elkuno213/ros2-humble-dev:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    volumes:
      - .:/workspaces/ros2-ws
    environment:
      DISPLAY: ros2-novnc:0.0
      RCUTILS_COLORIZED_OUTPUT: "1"
    networks:
      - ros2-network
    stdin_open: true
    tty: true

  ros2-novnc:
    container_name: ros2-novnc
    image: theasp/novnc:latest
    environment:
      DISPLAY_WIDTH: "1800"
      DISPLAY_HEIGHT: "1012"
      RUN_XTERM: "no"
      RUN_FLUXBOX: "yes"
    ports:
      - "${NOVNC_PORT:-8080}:8080"
    networks:
      - ros2-network

networks:
  ros2-network:
    name: ros2-network
