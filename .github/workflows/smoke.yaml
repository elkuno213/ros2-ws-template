name: smoke

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ROS2 image
        run: docker compose build ros2

      - name: Build and test example packages
        run: |
          docker compose run --rm ros2 bash -lc '
            set -eo pipefail
            cd /workspaces/ros2-ws
            source /opt/ros/humble/setup.bash
            ruff format --check .
            ruff check .
            rosdep update
            rosdep install --from-paths src --ignore-src -r -y
            colcon build --symlink-install --cmake-args -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -GNinja
            colcon test
            colcon test-result --all --verbose
          '
