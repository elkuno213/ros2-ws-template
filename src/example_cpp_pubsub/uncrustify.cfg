#
# Keep ament_uncrustify enabled while matching this repository's clang-format style for the C++
# example package. The stock ROS Humble config enforces Allman braces and right-aligned pointers,
# which conflicts with the repo-level .clang-format.

newlines = auto
indent_columns = 2
indent_continue = 4
indent_with_tabs = 0
indent_class = true
indent_access_spec = -2
indent_func_call_param = false
indent_cpp_lambda_body = false
indent_cpp_lambda_only_once = true

nl_namespace_brace = remove
nl_class_brace = remove
nl_struct_brace = remove
nl_fdef_brace = remove

sp_paren_brace = force
sp_before_ptr_star = remove
sp_after_ptr_star = force
sp_after_ptr_star_func = force
sp_before_ptr_star_func = remove
sp_before_byref = remove
sp_after_byref = force
sp_after_byref_func = force
sp_before_byref_func = remove

sp_cpp_lambda_paren_brace = force
nl_cpp_lambda_leave_one_liners = true

align_var_struct_span = 1
align_var_struct_thresh = 8
align_var_class_span = 3
align_var_class_thresh = 64
